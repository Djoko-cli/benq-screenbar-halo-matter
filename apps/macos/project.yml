name: HaloCompagnon
options:
  bundleIdPrefix: fr.djoko.halo
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    # Textes : catalogues Localizable.xcstrings (francais, langue de developpement, et anglais),
    # cles extraites par le compilateur.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  HaloProtocole:
    type: framework
    platform: macOS
    sources:
      - path: HaloProtocole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.halo.protocole
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
  HaloCompagnon:
    type: application
    platform: macOS
    sources:
      - path: HaloCompagnon
    dependencies:
      - target: HaloProtocole
    settings:
      base:
        PRODUCT_NAME: Halo Compagnon
        PRODUCT_MODULE_NAME: HaloCompagnon
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.halo.compagnon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Halo Compagnon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: HaloCompagnon/HaloCompagnon.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HaloProtocoleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HaloProtocoleTests
    dependencies:
      - target: HaloProtocole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.halo.protocole.tests
        GENERATE_INFOPLIST_FILE: YES
  HaloCompagnonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HaloCompagnonTests
    dependencies:
      - target: HaloCompagnon
      - target: HaloProtocole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.halo.compagnon.tests
        GENERATE_INFOPLIST_FILE: YES
        # Le produit s'appelle "Halo Compagnon" (avec une espace), pas comme la cible.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Halo Compagnon.app/Contents/MacOS/Halo Compagnon"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  HaloCompagnon:
    build:
      targets:
        HaloCompagnon: all
        HaloProtocole: all
        HaloProtocoleTests: [test]
        HaloCompagnonTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HaloProtocoleTests
        - HaloCompagnonTests
    archive:
      config: Release
