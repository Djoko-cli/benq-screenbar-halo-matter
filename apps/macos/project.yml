name: HaloCompagnon
options:
  bundleIdPrefix: fr.djoko.halo
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Signature.xcconfig
  Release: Signature.xcconfig
# Sparkle 2 : les mises a jour de l'app, a une version figee (gestionnaire de paquets Swift).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Textes : catalogues Localizable.xcstrings (francais, langue de developpement, et anglais),
    # cles extraites par le compilateur.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targets:
  HaloProtocole:
    type: framework
    platform: macOS
    sources:
      - path: HaloProtocole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.halo.protocole
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
  HaloCompagnon:
    type: application
    platform: macOS
    sources:
      - path: HaloCompagnon
    dependencies:
      - target: HaloProtocole
      - package: Sparkle
    # Les cles que la generation de l'Info.plist par Xcode ne connait pas : ce fichier, genere par XcodeGen, est
    # complete par celles de INFOPLIST_KEY_ (GENERATE_INFOPLIST_FILE).
    info:
      path: HaloCompagnon/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Mises a jour (Sparkle 2) : le flux des versions publiees et la cle publique Ed25519 (reglages ci-dessous) ;
        # recherche au demarrage puis toutes les 24 h, telechargement et installation automatiques ; installation
        # par le service de Sparkle, l'app restant dans le bac a sable.
        SUFeedURL: $(FLUX_MISES_A_JOUR)
        SUPublicEDKey: $(CLE_MISES_A_JOUR)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: true
        SUEnableInstallerLauncherService: true
    settings:
      base:
        PRODUCT_NAME: Halo Compagnon
        PRODUCT_MODULE_NAME: HaloCompagnon
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.halo.compagnon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Halo Compagnon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Halo Compagnon joint le pont Halo sur le réseau local (Thread, par les routeurs de bordure)."
        # La version publiee (Outils/publier.sh) ; le numero de compilation, que compare Sparkle, est donne a la
        # publication : le nombre de commits de main.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Le flux des mises a jour (apps/macos/appcast.xml du depot, que publier.sh tient a jour, a son adresse brute)
        # et la cle publique ; la repetition les remplace en ligne de commande.
        FLUX_MISES_A_JOUR: https://raw.githubusercontent.com/Djoko-cli/benq-screenbar-halo-matter/main/apps/macos/appcast.xml
        CLE_MISES_A_JOUR: nRIVHOXbEktqGduJ4ukxhjZzlUaiE/yqR3sgbW9Ie6E=
        CODE_SIGN_ENTITLEMENTS: HaloCompagnon/HaloCompagnon.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HaloProtocoleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HaloProtocoleTests
    dependencies:
      - target: HaloProtocole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.halo.protocole.tests
        GENERATE_INFOPLIST_FILE: YES
  HaloCompagnonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HaloCompagnonTests
    dependencies:
      - target: HaloCompagnon
      - target: HaloProtocole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.djoko.halo.compagnon.tests
        GENERATE_INFOPLIST_FILE: YES
        # Le produit s'appelle "Halo Compagnon" (avec une espace), pas comme la cible.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Halo Compagnon.app/Contents/MacOS/Halo Compagnon"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  HaloCompagnon:
    build:
      targets:
        HaloCompagnon: all
        HaloProtocole: all
        HaloProtocoleTests: [test]
        HaloCompagnonTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HaloProtocoleTests
        - HaloCompagnonTests
    archive:
      config: Release
