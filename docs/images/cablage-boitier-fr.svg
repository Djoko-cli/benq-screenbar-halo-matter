<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img">
<title>Pont Halo dans son boîtier, vu de dessus</title><desc>Vue de dessus du boîtier : à gauche l'ESP32-C6 SuperMini vu de dos ; à droite le BM5602 face plate visible, tourné d'un quart de tour, antenne à droite, pastilles sur le bord gauche de 9 en haut à 1 en bas. Six fils : IO14 vers CSN, IO18 vers SCK, IO19 vers GIO2, IO20 vers SDIO, 3V3 vers VDD, GND vers VSS.</desc>
<style>
.fond{fill:#ffffff}.t{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.ts{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#59636e}
.c6{fill:#eeedfe;stroke:#534ab7;stroke-width:1}.mod{fill:#f6f8fa;stroke:#8c959f;stroke-width:1}
.off{fill:#d0d7de;stroke:#8c959f;stroke-width:.5}.pt{fill:none;stroke:#8c959f;stroke-width:.6;stroke-dasharray:4 4}
@media (prefers-color-scheme:dark){.fond{fill:#0d1117}.t{fill:#e6edf3}.ts{fill:#9198a1}
.c6{fill:#26215c;stroke:#afa9ec}.mod{fill:#161b22;stroke:#6e7681}.off{fill:#30363d;stroke:#6e7681}.pt{stroke:#6e7681}}
</style>
<rect class="fond" x="0" y="0" width="680" height="700" rx="12"/>
<text class="t" x="40" y="30">Pont Halo dans son boîtier, vu de dessus</text>
<rect class="c6" x="60" y="60" width="170" height="420" rx="6"/>
<circle class="off" cx="75" cy="90" r="5" opacity=".6"/><text class="ts" x="88" y="94" opacity=".7">7</text>
<circle class="off" cx="215" cy="90" r="6" opacity=".6"/><text class="ts" x="200" y="94" text-anchor="end" opacity=".7">8</text>
