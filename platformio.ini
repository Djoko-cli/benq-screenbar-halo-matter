; BenQ ScreenBar Halo (1re generation) -> Matter
; ESP32 + module RF Holtek BM5602-60-1 (transceiver BC5602)
;
; La bibliotheque Matter est fournie avec le core Arduino-ESP32 3.x, avec ses
; archives esp-matter precompilees : rien a installer via lib_deps. En revanche
; il FAUT le fork pioarduino de la plateforme, la version officielle de
; PlatformIO etant restee au core 2.0.x qui n'a pas Matter du tout.
;
; La pile Matter pese ~1,4 Mo : le schema de partitions huge_app (3 Mo APP)
; est necessaire. Consequence assumee : pas de partition OTA sur une flash 4 Mo.
;
; Tailles mesurees : C3 1,79 Mo | esp32 1,81 Mo | S3 1,97 Mo | C6 2,41 Mo.
; min_spiffs.csv (1,9 Mo APP x2, donc OTA possible) ne tient QUE sur C3 et
; esp32 classique, avec ~150 Ko de marge. Sur S3 et C6 ca deborde.

[platformio]
default_envs = esp32c6supermini

[env]
; 55.03.312-1 = core Arduino-ESP32 3.3.12 (IDF 5.5.5, Matter 1.5), exige
; PlatformIO Core >= 6.2.0. Adopte le 23/09 pour Matter sur Thread ; tous les
; envs le partagent (PlatformIO ne garde qu'un core : alterner retelechargerait
; ~2 Go a chaque fois). Ancien core : 55.03.38-1 (3.3.8), voir git.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; log2file : ecrit toute la session serie dans platformio-device-monitor-*.log
; a la racine du projet, pour pouvoir relire une capture sans dependre du
; scrollback du terminal.
monitor_filters = esp32_exception_decoder, time, log2file
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
; Version du firmware, pour src/ seulement : FW_VERSION a la main, FW_GIT_REV
; par tools/git_rev.py (hash court, "-dirty" si un fichier suivi est modifie
; ou si un fichier non suivi traine dans src/, include/ ou lib/).
; Ensemble ("0.3.0-<commit>"), elles forment la version du descripteur
; d'application (src/app_desc.c), le "Programme interne" d'Apple Home. Les
; envs qui ont leur propre build_src_flags doivent reprendre ${env.build_src_flags}.
build_src_flags =
    -DFW_VERSION='"0.3.0"'
    !python3 tools/git_rev.py

; ---------------------------------------------------------------------------
; ESP32-C3 -- cible recommandee
; Commissioning BLE compile : le controleur Matter fournit lui-meme le Wi-Fi,
; aucun identifiant a saisir ni a compiler.
; SPI : SCK=4  MISO=5  MOSI=6  CSN=7
; ---------------------------------------------------------------------------
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DPIN_RF_SCK=4
    -DPIN_RF_MISO=5
    -DPIN_RF_MOSI=6
    -DPIN_RF_CSN=7
    ; IO8 porte la WS2812 de la DevKitM-1 (non declaree) : pas de voyant visible.
    -DPIN_STATUS_LED=8
    ; Le C3 n'a pas de TinyUSB : USB_MODE=1 route Serial vers l'USB
    ; Serial/JTAG materiel. Sans ce flag, la compilation echoue sur USBSerial.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; ESP32-S3 DevKitC-1 -- commissioning BLE compile
; ---------------------------------------------------------------------------
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DPIN_RF_SCK=12
    -DPIN_RF_MISO=13
    -DPIN_RF_MOSI=11
    -DPIN_RF_CSN=10
    ; IO48 porte la WS2812 de la DevKitC-1 v1.0 (non declaree) : pas de voyant.
    -DPIN_STATUS_LED=48
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; ESP32-C6 SuperMini -- cible utilisee sur ce montage
;
; PlatformIO n'a pas de definition pour cette carte : on part de la DevKitC-1
; (meme puce) en corrigeant ce qui differe.
;   - flash 4 Mo et non 8 Mo
;   - voyant d'etat : la WS2812 adressable d'IO8 (la LED simple d'IO15 reste
;     en entree, donc eteinte)
;   - bouton BOOT sur IO9 (le variant esp32c6 ne definit pas BOOT_PIN)
;
; Choix des broches SPI : IO12/IO13 sont l'USB natif, et IO2/4/5/8/9/15 sont
; des broches de strapping. Restent IO14 et IO18-20, toutes sur le connecteur
; EXTERIEUR gauche (6-14-15-18-19-20-3V3-GND-5V) : les six fils, alimentation
; comprise, tiennent sur une seule rangee. IO21/22 existent mais en trous
; interieurs, penibles a souder.
; ---------------------------------------------------------------------------
[env:esp32c6supermini]
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_size = 4MB
build_flags =
    ${env.build_flags}
    -DPIN_RF_SCK=18
    -DPIN_RF_MISO=19
    -DPIN_RF_MOSI=20
    -DPIN_RF_CSN=14
    -DPIN_RF_CSN2=10
    ; Ecoute d'un bus tiers : on reutilise les broches qui portent deja les
    ; fils du module, pour n'avoir aucune broche nouvelle a trouver.
    -DPIN_TAP_SCK=18
    -DPIN_TAP_MOSI=20
    -DPIN_TAP_CS=14
    -DPIN_STATUS_LED=15
    ; WS2812 de la carte, voyant d'etat du produit (DIAG_ONLY : seulement mise
    ; au noir au demarrage). Broche de strapping : jamais pilotee avant setup().
    -DPIN_RGB_STATUS_LED=8
    -DPIN_DECOMMISSION_BTN=9
    ; Polarite de la LED simple : passer a 1 si elle s'allume a l'envers. Sans
    ; effet ici, IO15 restant en entree tant que la WS2812 est declaree.
    -DSTATUS_LED_ACTIVE_LOW=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; C6 SuperMini, Matter sur THREAD (Apple Home). Core 3.3.12 au moins :
; Matter.selectNetwork(MATTER_NETWORK_THREAD) y met la mise en service Thread
; sur l'EP0 et n'initialise jamais le Wi-Fi. Sans cet appel (esp32c6supermini),
; l'EP0 n'annonce que le Wi-Fi : Apple Home passerait en Wi-Fi (etude du 23/09).
; Premier flash : pio run -e esp32c6thread -t erase, puis -t upload.
; ---------------------------------------------------------------------------
[env:esp32c6thread]
extends = env:esp32c6supermini
build_flags =
    ${env:esp32c6supermini.build_flags}
    -DMATTER_NET_THREAD=1
    ; 1 = end device minimal (MED) : recepteur toujours actif, donc aussi
    ; reactif qu'un routeur, mais ne relaie rien. Le MED n'a PAS reduit les
    ; echecs lampe (23/09, +20 dBm Thread a quelques cm du BM5602) : routeur
    ; 17 paquets sur 250 sans accuse, MED 19 sur 64. Garde en 1, dernier role
    ; flashe ; la garde se juge a role constant ('lampe garde 0|1').
    ; Valeur par defaut seulement : 'matter med 0|1|2' la remplace (NVS, au
    ; demarrage suivant).
    -DMATTER_THREAD_MED=1
    ; Enveloppe du reglage du type Thread par esp_matter::start (routeur) :
    ; 'matter med 1' y met MED des l'init de Thread, sans nouvelle attache.
    ; Les deux lignes vont ensemble : l'une sans l'autre ne lie pas.
    -DHALO_WRAP_THREAD_DEVTYPE=1
    -Wl,--wrap=_ZN4chip11DeviceLayer8Internal40GenericThreadStackManagerImpl_OpenThreadINS0_22ThreadStackManagerImplEE20_SetThreadDeviceTypeENS0_19ConnectivityManager16ThreadDeviceTypeE

; ---------------------------------------------------------------------------
; C6 SuperMini, build DIAGNOSTIC : ni Matter, ni Wi-Fi, ni BLE.
;
; Le noeud Matter non appaire emet des balises BLE en continu sur 2402, 2426 et
; 2480 MHz -- a deux centimetres du BM5602, et a 3 MHz du canal BenQ. Impossible
; d'ecouter proprement dans ces conditions. Ce build coupe la radio de l'ESP32
; et ne garde que les outils RF ; il flashe aussi beaucoup plus vite.
; ---------------------------------------------------------------------------
[env:esp32c6diag]
extends = env:esp32c6supermini
board_build.partitions = min_spiffs.csv
; Exclure les sources Matter/reseau : les compiler suffirait a lier toute la
; pile esp-matter et a faire deborder la partition.
build_src_filter = +<*> -<matter_bridge.cpp> -<net.cpp>
build_flags =
    ${env:esp32c6supermini.build_flags}
    -DDIAG_ONLY

; ---------------------------------------------------------------------------
; ESP32 classique (WROOM-32 / DevKit v1) -- DEGRADE
; CONFIG_ENABLE_CHIPOBLE n'est pas active dans les bibliotheques precompilees
; d'Arduino pour cette puce : pas de mise en service par BLE. Il faut donner le
; Wi-Fi a l'ESP32 avant l'appairage, avec la commande serie :
;     wifi <ssid> <mot-de-passe>
; Matter se met alors en service sur IP. Prefere un C3 si tu as le choix.
; SPI VSPI : SCK=18  MISO=19  MOSI=23  CSN=5
; ---------------------------------------------------------------------------
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DPIN_RF_SCK=18
    -DPIN_RF_MISO=19
    -DPIN_RF_MOSI=23
    -DPIN_RF_CSN=5
    -DPIN_STATUS_LED=2
